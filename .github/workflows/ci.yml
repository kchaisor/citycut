name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      update_visual_baselines:
        description: Upload refreshed Playwright snapshot PNGs as an artifact (runs with --update-snapshots)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Chromium for visual tests
        run: npx playwright install --with-deps chromium
      - name: Playwright visual tests
        run: |
          if [ "${{ github.event.inputs.update_visual_baselines }}" = "true" ]; then
            npm run test:visual:update
          else
            npm run test:visual
          fi
      - name: Upload visual baseline PNGs
        if: success() || github.event.inputs.update_visual_baselines == true
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: tests/visual/*-snapshots/*.png
          if-no-files-found: error
      - name: Upload Playwright report on failure
        if: failure() && github.event.inputs.update_visual_baselines != true
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-diffs
          path: |
            test-results/**
            tests/visual/**/*-diff.png
          if-no-files-found: ignore