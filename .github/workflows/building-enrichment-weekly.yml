name: Building enrichment tiles (monthly)

on:
  schedule:
    # 3:00 AM Melbourne on the 1st of each month. Cron is UTC and can't follow
    # daylight saving, so fire at 16:00 and 17:00 UTC daily and let the gate job
    # run only when it's 03:xx on the 1st in Australia/Melbourne.
    - cron: "0 16,17 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          now=$(TZ=Australia/Melbourne date +%d%H)
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$now" = "0103" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Melbourne day+hour: $now"

  build-tiles:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Python deps
        run: pip install -r pipeline/requirements.txt
      - name: Cache tippecanoe 2.79.0
        id: tippecanoe-cache
        uses: actions/cache@v5
        with:
          path: ~/.local/bin/tippecanoe
          key: tippecanoe-2.79.0-${{ runner.os }}-${{ runner.arch }}
      - name: Install tippecanoe
        if: steps.tippecanoe-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential libsqlite3-dev zlib1g-dev
          git clone --depth 1 --branch 2.79.0 https://github.com/felt/tippecanoe.git /tmp/tippecanoe-src
          make -C /tmp/tippecanoe-src -j"$(nproc)"
          mkdir -p "$HOME/.local/bin"
          cp /tmp/tippecanoe-src/tippecanoe "$HOME/.local/bin/tippecanoe"
      - name: Put tippecanoe on PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Python tests
        run: pytest pipeline/test_build_enrichment.py pipeline/test_extent.py pipeline/test_zone_use.py pipeline/test_zone_use_sync.py pipeline/test_table_hash_sync.py pipeline/test_overture_building_use_sync.py pipeline/test_cascade_parity.py -q
      - name: Build enrichment PMTiles (Greater Melbourne GCCSA)
        run: node scripts/build-building-enrichment-pmtiles.mjs
        env:
          TIPPECANOE: tippecanoe
          BUILD_ENRICHMENT_BBOX: 144.333634,-38.502988,145.878412,-37.175099
          BUILD_ENRICHMENT_MIN_ZOOM: "14"
          BUILD_ENRICHMENT_MAX_ZOOM: "14"
      - name: Log manifest (BCA / LiDAR / CLUE — never silent)
        run: |
          cat public/building-enrichment-manifest.json
          echo "[enrichment] LiDAR: no data, ELVIS not ordered"
      - name: Publish PMTiles + manifest to GitHub Release (main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="building-enrichment-$(date -u +%Y%m%d)"
          gh release create "$tag" public/building-enrichment.pmtiles public/building-enrichment-manifest.json \
            --title "Building enrichment PMTiles" \
            --notes "Auto-built Greater Melbourne GCCSA. Manifest includes pmtilesSha256 for Pages deploy verification." \
            || (gh release upload "$tag" public/building-enrichment.pmtiles --clobber && gh release upload "$tag" public/building-enrichment-manifest.json --clobber)
          gh release view building-enrichment-latest >/dev/null 2>&1 \
            && (gh release upload building-enrichment-latest public/building-enrichment.pmtiles --clobber && gh release upload building-enrichment-latest public/building-enrichment-manifest.json --clobber) \
            || gh release create building-enrichment-latest public/building-enrichment.pmtiles public/building-enrichment-manifest.json \
              --title "Building enrichment PMTiles (latest)" \
              --notes "Rolling latest assets (tiles + manifest); dated tags are immutable snapshots."
      - name: Publish test release (non-main branches)
        if: github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="building-enrichment-test-gm"
          gh release view "$tag" >/dev/null 2>&1 \
            && (gh release upload "$tag" public/building-enrichment.pmtiles --clobber && gh release upload "$tag" public/building-enrichment-manifest.json --clobber) \
            || gh release create "$tag" public/building-enrichment.pmtiles public/building-enrichment-manifest.json \
              --title "Building enrichment PMTiles (GM test)" \
              --notes "Branch test build for Greater Melbourne GCCSA — not used by production Pages."
